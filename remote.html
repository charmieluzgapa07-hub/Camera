<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Banner Remote Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .remote-card {
            background: #1e293b;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin: 16px 0 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        .input-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        input[type="text"] {
            background: #0f172a;
            border: 1px solid #475569;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        .btn-reset {
            margin-top: 20px;
            width: 100%;
            background: #e11d48;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #be123c;
        }
    </style>
</head>
<body>

    <div class="remote-card">
        <h2>🎛️ Banner Live Remote</h2>

        <div class="section-title">Edit Live Text</div>

        <div class="input-group">
            <label>Highlight Text (Unang Item)</label>
            <input type="text" id="text1">
        </div>

        <div class="input-group">
            <label>Church Name (Pangalawang Item)</label>
            <input type="text" id="text2">
        </div>

        <div class="input-group">
            <label>Worship Name (Pangatlong Item)</label>
            <input type="text" id="text3">
        </div>

        <div class="section-title">Color Settings</div>

        <div class="color-picker-grid">
            <div class="color-item">
                <label>Highlight Text</label>
                <input type="color" id="highlightColor">
            </div>
            <div class="color-item">
                <label>Normal Text</label>
                <input type="color" id="textColor">
            </div>
            <div class="color-item">
                <label>Banner Background</label>
                <input type="color" id="bgColor">
            </div>
            <div class="color-item">
                <label>Border & Clock</label>
                <input type="color" id="borderColor">
            </div>
        </div>

        <button class="btn-reset" onclick="resetDefaults()">Reset to Defaults</button>
    </div>

    <script>
        const channel = new BroadcastChannel('banner_remote_channel');

        const defaultData = {
            text1: "CONNECT WITH US",
            text2: "TOGETHER Church Skyline - UPC",
            text3: "TOGETHER Worship",
            textColor: "#1a1a1a",
            highlightColor: "#333333",
            bgColor: "#ffffff",
            borderColor: "#2d3a60"
        };

        const inputs = ['text1', 'text2', 'text3', 'textColor', 'highlightColor', 'bgColor', 'borderColor'];

        function loadSavedData() {
            const saved = localStorage.getItem('banner_data');
            return saved ? JSON.parse(saved) : defaultData;
        }

        function syncRemote() {
            const data = {};
            inputs.forEach(id => {
                data[id] = document.getElementById(id).value;
            });

            localStorage.setItem('banner_data', JSON.stringify(data));
            channel.postMessage(data);
        }

        function initRemote() {
            const currentData = loadSavedData();
            inputs.forEach(id => {
                const element = document.getElementById(id);
                element.value = currentData[id] || defaultData[id];
                element.addEventListener('input', syncRemote);
            });
        }

        function resetDefaults() {
            localStorage.setItem('banner_data', JSON.stringify(defaultData));
            inputs.forEach(id => {
                document.getElementById(id).value = defaultData[id];
            });
            channel.postMessage(defaultData);
        }

        initRemote();
    </script>
</body>
</html>
