<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Stream Borderless Flapping Overlay</title>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, logoBadge;
        let clock = new THREE.Clock();
        
        const logoUrl = 'https://i.postimg.cc/q7phbDXB/Code-Generated-Image-(7).png';

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 7.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);

            const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
            frontLight.position.set(0, 2, 5);
            scene.add(frontLight);

            loadLogoTexture(logoUrl);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function loadLogoTexture(url) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = 'anonymous';

            textureLoader.load(url, function(texture) {
                texture.generateMipmaps = true;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                createBadge(texture);
            });
        }

        function createBadge(texture) {
            const radius = 2.2;
            const thickness = 0.05; 
            const segments = 64;

            const geometry = new THREE.CylinderGeometry(radius, radius, thickness, segments);

            // Ganap na pinang-transparent ang gilid (wala nang makikitang kulay gold o dark sa side)
            const edgeMaterial = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.0
            });

            const logoMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 1.0
            });

            const materials = [
                edgeMaterial, // Gilid - Invisible/Transparent na
                logoMaterial, // Harap (Front)
                logoMaterial  // Likod (Back)
            ];

            logoBadge = new THREE.Mesh(geometry, materials);
            logoBadge.rotation.x = Math.PI / 2;
            scene.add(logoBadge);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (logoBadge) {
                let elapsedTime = clock.getElapsedTime();

                logoBadge.rotation.y = 0;
                logoBadge.rotation.z = 0;

                let cycleTime = elapsedTime % 60; 
                let amplitude;

                // Tuwing 1 minuto ay mag-f-flap nang malalim para makita ang likod nang walang nakikitang gilid
                if (cycleTime < 2.5) {
                    let progress = cycleTime / 2.5; 
                    amplitude = 0.12 + (1.48 - 0.12) * Math.sin(progress * Math.PI);
                } else {
                    amplitude = 0.12; 
                }

                logoBadge.rotation.x = (Math.PI / 2) + Math.sin(elapsedTime * 2.2) * amplitude;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
