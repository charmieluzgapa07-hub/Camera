<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Stream</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>

    <script>
        const video = document.getElementById('cam');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                alert("Error sa Camera: " + err.message);
            }
        }

        // Subukang i-trigger agad pagka-load
        startCamera();

        // Fallback: Kapag na-tap o na-click ang screen, pilitin ding i-play kung sakaling na-block
        document.body.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            }
        });
    </script>
</body>
</html>
